name: collect-charts

on:
  schedule:
    - cron: "17 * * * *"        # every hour (UTC) — Apple hourly, Google/Steam refresh whenever their charts move
  workflow_dispatch:
    inputs:
      skip_gplay:
        description: "Skip Google Play (1 = skip)"
        default: ""
      skip_steam:
        description: "Skip Steam (1 = skip)"
        default: ""

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Collect charts
        env:
          SKIP_GPLAY: ${{ github.event.inputs.skip_gplay }}
          SKIP_STEAM: ${{ github.event.inputs.skip_steam }}
        run: node scripts/collect.mjs
      - name: Commit data
        run: |
          git config user.name "game-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "data: charts $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
