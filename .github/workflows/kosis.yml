name: collect-kosis

on:
  schedule:
    - cron: "30 1 * * 1"      # 10:30 KST every Monday (온라인쇼핑동향 monthly release ~1st business day)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kosis
  cancel-in-progress: false

jobs:
  kosis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Collect KOSIS
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: node scripts/collect-kosis.mjs
      - name: Commit data
        run: |
          git config user.name "game-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "data: kosis $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase -X theirs origin main || true
            git push
          fi
